<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--paper-sheet);font-family:var(--font-body);}</style></head><body><div style="display:flex;gap:8px;"><div style="flex:1;min-width:70px;"><div style="height:56px;background:var(--paper-card);border:1px solid rgba(0,0,0,.08);"></div><div style="font-family:var(--font-display);font-weight:500;font-size:10px;letter-spacing:1px;color:var(--ink);margin-top:5px;">CARD</div><div style="font-family:var(--font-body);font-size:9.5px;color:var(--ink-faint);">--paper-card</div></div><div style="flex:1;min-width:70px;"><div style="height:56px;background:var(--paper-frame);border:1px solid rgba(0,0,0,.08);"></div><div style="font-family:var(--font-display);font-weight:500;font-size:10px;letter-spacing:1px;color:var(--ink);margin-top:5px;">FRAME</div><div style="font-family:var(--font-body);font-size:9.5px;color:var(--ink-faint);">--paper-frame</div></div><div style="flex:1;min-width:70px;"><div style="height:56px;background:var(--paper-inset);border:1px solid rgba(0,0,0,.08);"></div><div style="font-family:var(--font-display);font-weight:500;font-size:10px;letter-spacing:1px;color:var(--ink);margin-top:5px;">INSET</div><div style="font-family:var(--font-body);font-size:9.5px;color:var(--ink-faint);">--paper-inset</div></div><div style="flex:1;min-width:70px;"><div style="height:56px;background:var(--paper-sheet);border:1px solid rgba(0,0,0,.08);"></div><div style="font-family:var(--font-display);font-weight:500;font-size:10px;letter-spacing:1px;color:var(--ink);margin-top:5px;">SHEET</div><div style="font-family:var(--font-body);font-size:9.5px;color:var(--ink-faint);">--paper-sheet</div></div><div style="flex:1;min-width:70px;"><div style="height:56px;background:var(--paper-band);border:1px solid rgba(0,0,0,.08);"></div><div style="font-family:var(--font-display);font-weight:500;font-size:10px;letter-spacing:1px;color:var(--ink);margin-top:5px;">BAND</div><div style="font-family:var(--font-body);font-size:9.5px;color:var(--ink-faint);">--paper-band</div></div><div style="flex:1;min-width:70px;"><div style="height:56px;background:var(--paper-desk);border:1px solid rgba(0,0,0,.08);"></div><div style="font-family:var(--font-display);font-weight:500;font-size:10px;letter-spacing:1px;color:var(--ink);margin-top:5px;">DESK</div><div style="font-family:var(--font-body);font-size:9.5px;color:var(--ink-faint);">--paper-desk</div></div><div style="flex:1;min-width:70px;"><div style="height:56px;background:var(--paper-tray);border:1px solid rgba(0,0,0,.08);"></div><div style="font-family:var(--font-display);font-weight:500;font-size:10px;letter-spacing:1px;color:var(--ink);margin-top:5px;">TRAY</div><div style="font-family:var(--font-body);font-size:9.5px;color:var(--ink-faint);">--paper-tray</div></div></div></body></html>
