<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--paper-sheet);font-family:var(--font-body);}</style></head><body><div style="display:flex;gap:26px;padding:8px 4px 14px;">
