<!-- @dsCard group="Foundations" viewport="700x180" subtitle="Two easings, five keyframes, ≤400ms" name="Motion" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--paper-sheet);font-family:var(--font-body);}</style></head><body><div style="display:flex;gap:20px;">
<div style="flex:1;">
<div style="font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:1.5px;color:var(--ink-muted);border-bottom:2px solid var(--line);padding-bottom:4px;">EASINGS</div>
<div style="font-family:var(--font-body);font-size:11.5px;color:var(--ink);line-height:1.8;margin-top:6px;">settle · cubic-bezier(.22,1,.36,1)<br>reward · cubic-bezier(.34,1.56,.64,1)</div>
</div>
<div style="flex:1;">
<div style="font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:1.5px;color:var(--ink-muted);border-bottom:2px solid var(--line);padding-bottom:4px;">DURATIONS</div>
<div style="font-family:var(--font-body);font-size:11.5px;color:var(--ink);line-height:1.8;margin-top:6px;">press 150 · hover 180 · fade 250<br>drop/check 320 · spotlight 400</div>
</div>
<div style="flex:1.2;">
<div style="font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:1.5px;color:var(--ink-muted);border-bottom:2px solid var(--line);padding-bottom:4px;">KEYFRAMES</div>
<div style="display:flex;gap:10px;margin-top:10px;">
<div style="width:40px;height:40px;background:var(--lesson);animation:et-drop 1.4s var(--ease-settle) infinite;"></div>
<div style="width:40px;height:40px;background:var(--vitamin);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;"><span style="display:inline-block;animation:et-check 1.4s var(--ease-reward) infinite;">✓</span></div>
<div style="width:40px;height:40px;background:var(--accent);animation:et-pop 1.4s var(--ease-settle) infinite;"></div>
</div>
</div>
</div></body></html>
