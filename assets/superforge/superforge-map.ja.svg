<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" role="img" aria-label="Superforge architectural routing diagram">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0e0e10"/>
    </linearGradient>
  </defs>

  <!-- Container Outline -->
  <rect x="1" y="1" width="978" height="578" rx="12" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Top bar: The Prompt Input -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)" font-weight="500" letter-spacing="0.14em">SUPERFORGE // THE FRONT DESK</text>
    <text x="0" y="32" font-family="'Outfit', system-ui, sans-serif" font-size="24" font-weight="400" fill="#ffffff" letter-spacing="-0.02em">One sentence in. It decides who takes it, in what order, and <tspan fill="#38bdf8" font-style="italic">what to run them on</tspan>.</text>
    
    <!-- Command line terminal prompt -->
    <rect x="0" y="52" width="908" height="46" rx="6" fill="#0b0b0b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="18" y="81" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#38bdf8">&gt; /superforge</text>
    <text x="142" y="81" font-family="'Outfit', system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.85)">I want to build a booking app for the café on my street</text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="162" x2="944" y2="162" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- 4 Unboxed Flow Phases -->
  <!-- Phase 1: Think -->
  <g transform="translate(36, 184)">
    <line x1="0" y1="0" x2="208" y2="0" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="24" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="#c084fc" font-weight="600" letter-spacing="0.1em">01 // THINK</text>
    <text x="0" y="44" font-family="'Outfit', system-ui, sans-serif" font-size="18" fill="#ffffff" font-weight="500">Decide What to Make</text>
    
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">superforge-brain</text>
      <text x="0" y="16" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)">docs/product-idea.md</text>

      <text x="0" y="48" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">superforge-biz</text>
      <text x="0" y="64" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)">docs/business-model.md</text>

      <text x="0" y="96" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">superforge-brand</text>
      <text x="0" y="112" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)">docs/brand.md</text>
    </g>
  </g>

  <!-- Phase 2: Build -->
  <g transform="translate(268, 184)">
    <line x1="0" y1="0" x2="208" y2="0" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="24" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="#60a5fa" font-weight="600" letter-spacing="0.1em">02 // BUILD</text>
    <text x="0" y="44" font-family="'Outfit', system-ui, sans-serif" font-size="18" fill="#ffffff" font-weight="500">Make It Real</text>
    
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">superforge-ui</text>
      <text x="0" y="16" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)">docs/design.md + html</text>

      <text x="0" y="48" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">superforge-dev</text>
      <text x="0" y="64" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)">docs/plan.md</text>
    </g>
  </g>

  <!-- Phase 3: Prove -->
  <g transform="translate(500, 184)">
    <line x1="0" y1="0" x2="208" y2="0" stroke="#14b8a6" stroke-width="2"/>
    <text x="0" y="24" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="#2dd4bf" font-weight="600" letter-spacing="0.1em">03 // PROVE</text>
    <text x="0" y="44" font-family="'Outfit', system-ui, sans-serif" font-size="18" fill="#ffffff" font-weight="500">Check Everything</text>
    
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">superforge-test</text>
      <text x="0" y="16" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)">the tests</text>

      <text x="0" y="48" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">superforge-debug</text>
      <text x="0" y="64" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)">root cause in doc</text>

      <text x="0" y="96" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">superforge-a11y &amp; secure</text>
      <text x="0" y="112" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)">docs/security.md</text>
    </g>
  </g>

  <!-- Phase 4: Ship -->
  <g transform="translate(732, 184)">
    <line x1="0" y1="0" x2="208" y2="0" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="24" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="#34d399" font-weight="600" letter-spacing="0.1em">04 // SHIP</text>
    <text x="0" y="44" font-family="'Outfit', system-ui, sans-serif" font-size="18" fill="#ffffff" font-weight="500">Get It Out the Door</text>
    
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">superforge-roast</text>
      <text x="0" y="16" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)">docs/critique.md</text>

      <text x="0" y="48" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">superforge-verify</text>
      <text x="0" y="64" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)">docs/verification.md</text>

      <text x="0" y="96" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">superforge-ship &amp; handoff</text>
      <text x="0" y="112" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)">docs/ship-readiness.md</text>
    </g>
  </g>

  <!-- Bottom Footer Line -->
  <line x1="36" y1="460" x2="944" y2="460" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <g transform="translate(36, 490)">
    <text x="0" y="0" font-family="'Outfit', system-ui, sans-serif" font-size="18" fill="#ffffff" font-weight="400">The conversation is disposable. The <tspan fill="#38bdf8" font-style="italic">decisions</tspan> are not.</text>
    <text x="0" y="24" font-family="'DM Mono', ui-monospace, monospace" font-size="11.5" fill="rgba(255,255,255,0.44)">product-idea.md · business-model.md · brand.md · design.md · plan.md · security.md · ship-readiness.md · .handoff/</text>
    <text x="908" y="12" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="#38bdf8" text-anchor="end" letter-spacing="0.1em">PERSISTS ACROSS SESSIONS</text>
  </g>
</svg>