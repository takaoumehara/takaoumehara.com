<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-label="Superforge model tiering matrix">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0e0e10"/>
    </linearGradient>
  </defs>

  <!-- Container Outline -->
  <rect x="1" y="1" width="978" height="618" rx="12" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Top bar -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)" font-weight="500" letter-spacing="0.14em">MODEL TIERS // CHOSEN BEFORE ANY AGENT IS SPAWNED</text>
    <text x="0" y="32" font-family="'Outfit', system-ui, sans-serif" font-size="24" font-weight="400" fill="#ffffff" letter-spacing="-0.02em">A rename shouldn't be billed like an <tspan fill="#38bdf8" font-style="italic">architecture decision</tspan>.</text>
  </g>

  <!-- Table Header -->
  <g transform="translate(36, 126)">
    <line x1="0" y1="0" x2="908" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="0" y="24" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)" font-weight="600" letter-spacing="0.12em">TIER · WORK</text>
    <text x="400" y="24" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)" font-weight="600" letter-spacing="0.12em">Claude</text>
    <text x="540" y="24" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)" font-weight="600" letter-spacing="0.12em">Gemini</text>
    <text x="680" y="24" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)" font-weight="600" letter-spacing="0.12em">Codex</text>
    <text x="820" y="24" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.44)" font-weight="600" letter-spacing="0.12em">Kimi</text>
    <line x1="0" y1="38" x2="908" y2="38" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  </g>

  <!-- Row 1: A judgment -->
  <g transform="translate(36, 184)">
    <text x="0" y="0" font-family="'DM Mono', ui-monospace, monospace" font-size="14" fill="#f87171" font-weight="600">A · judgment</text>
    <text x="0" y="20" font-family="'Outfit', system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">design, review, root cause, verifying a claim</text>
    <text x="400" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">Opus 5</text>
    <text x="540" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">3.6 flash</text>
    <text x="680" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">Sol</text>
    <text x="820" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">K3 Max</text>
    <line x1="0" y1="38" x2="908" y2="38" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- Row 2: A endurance -->
  <g transform="translate(36, 246)">
    <text x="0" y="0" font-family="'DM Mono', ui-monospace, monospace" font-size="14" fill="#f87171" font-weight="600">A · endurance</text>
    <text x="0" y="20" font-family="'Outfit', system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">long unattended runs, overnight builds</text>
    <text x="400" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">Fable 5</text>
    <text x="540" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">3.6 flash</text>
    <text x="680" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">Sol</text>
    <text x="820" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">K3 Max</text>
    <line x1="0" y1="38" x2="908" y2="38" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- Row 3: B volume -->
  <g transform="translate(36, 308)">
    <text x="0" y="0" font-family="'DM Mono', ui-monospace, monospace" font-size="14" fill="#fbbf24" font-weight="600">B · volume</text>
    <text x="0" y="20" font-family="'Outfit', system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">features, UI, QA sweeps</text>
    <text x="400" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">Sonnet 5</text>
    <text x="540" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">3.6 flash</text>
    <text x="680" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">Terra</text>
    <text x="820" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">K3 High</text>
    <line x1="0" y1="38" x2="908" y2="38" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- Row 4: C routine -->
  <g transform="translate(36, 370)">
    <text x="0" y="0" font-family="'DM Mono', ui-monospace, monospace" font-size="14" fill="#34d399" font-weight="600">C · routine</text>
    <text x="0" y="20" font-family="'Outfit', system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">rote tests, formatting, renames</text>
    <text x="400" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">Haiku 4.5</text>
    <text x="540" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">3.6 flash</text>
    <text x="680" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">Luna</text>
    <text x="820" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.7)">K3 Standard</text>
    <line x1="0" y1="38" x2="908" y2="38" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- Row 5: D bulk text -->
  <g transform="translate(36, 432)">
    <text x="0" y="0" font-family="'DM Mono', ui-monospace, monospace" font-size="14" fill="#38bdf8" font-weight="600">D · bulk text</text>
    <text x="0" y="20" font-family="'Outfit', system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">no repo needed — runs on local gemini CLI</text>
    <text x="400" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.3)">—</text>
    <text x="540" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#ffffff" font-weight="600">3.6 flash</text>
    <text x="680" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.3)">—</text>
    <text x="820" y="10" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="rgba(255,255,255,0.3)">—</text>
  </g>

  <!-- Footer Takeaway -->
  <line x1="36" y1="510" x2="944" y2="510" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <g transform="translate(36, 546)">
    <text x="0" y="0" font-family="'Outfit', system-ui, sans-serif" font-size="18" fill="#ffffff" font-weight="400">Never every agent on the biggest model <tspan fill="#38bdf8" font-style="italic">just to be safe</tspan>.</text>
    <text x="0" y="24" font-family="'DM Mono', ui-monospace, monospace" font-size="11.5" fill="rgba(255,255,255,0.44)">Tier D never touches the repository, so it stays off Anthropic usage entirely.</text>
    <text x="908" y="12" font-family="'DM Mono', ui-monospace, monospace" font-size="11" fill="#38bdf8" text-anchor="end" letter-spacing="0.1em">ZERO ANTHROPIC TOKENS</text>
  </g>
</svg>