<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#142417"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Container Box -->
  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic Diagram (Right side: Memory Loop) -->
  <g transform="translate(730, 200)">
    <!-- Central Memory Store -->
    <rect x="70" y="125" width="150" height="70" rx="14" fill="#0d2e1b" stroke="#34d399" stroke-width="2"/>
    <text x="145" y="162" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">~/.FAILFORWARD</text>
    <text x="145" y="180" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">LEARNING STORE</text>

    <!-- Cycle arrows -->
    <!-- Record -->
    <path d="M 145 45 L 145 125" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="70" y="0" width="150" height="45" rx="8" fill="#13281b" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="145" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">RECORD FIX</text>

    <!-- Recall -->
    <path d="M 145 195 L 145 275" stroke="#34d399" stroke-width="2"/>
    <rect x="70" y="275" width="150" height="45" rx="8" fill="#13281b" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="145" y="303" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">RECALL BEFORE RUN</text>

    <!-- Avoid Loop -->
    <path d="M 70 297 C -10 297, -10 22, 70 22" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
    <text x="15" y="165" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PREVENT</text>
  </g>

  <!-- Left Content (Direct & Clear) -->
  <g transform="translate(180, 240)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="190" height="34" rx="17" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1"/>
    <text x="95" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">LEARNING MEMORY</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.2">failforward</text>

    <!-- Direct Subtitle -->
    <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Root-cause memory and error-prevention store
    </text>
    <text x="0" y="194" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      so AI agents never repeat the same mistake.
    </text>

    <!-- Specs Meta -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
        CLI Tool · Session Persistence · Zero Dummy Fallbacks
      </text>
    </g>
  </g>
</svg>
