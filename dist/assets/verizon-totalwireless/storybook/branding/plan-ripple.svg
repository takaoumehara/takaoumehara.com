<svg width="360" height="200" viewBox="0 0 360 200" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMaxYMid slice">
  <!--
    Total Wireless plan-card banner ripple.
    Vector recreation of the Figma "Plan header" teal ripple so it stays
    crisp at any card width. Concentric rings emanate from the top-right,
    lightening toward the centre. Colours are tints of tw-teal-400 (#00C8B7).
  -->
  <rect width="360" height="200" fill="#00C8B7" />
  <g>
    <circle cx="332" cy="58" r="252" fill="#17CCBD" />
    <circle cx="332" cy="58" r="182" fill="#40D6C8" />
    <circle cx="332" cy="58" r="116" fill="#72E1D6" />
    <circle cx="332" cy="58" r="56" fill="#A6EDE5" />
  </g>
</svg>
