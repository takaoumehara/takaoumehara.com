<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#24141c"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Container Box -->
  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic Diagram (Right side: Core Loop Cycle) -->
  <g transform="translate(730, 200)">
    <!-- Circular Loop Node -->
    <circle cx="160" cy="160" r="130" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="8,6"/>

    <!-- 4 Nodes along the cycle -->
    <g transform="translate(110, 0)">
      <rect x="0" y="0" width="100" height="46" rx="8" fill="#3f1222" stroke="#fb7185" stroke-width="1.5"/>
      <text x="50" y="28" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">1. CLARITY</text>
    </g>

    <g transform="translate(240, 137)">
      <rect x="0" y="0" width="110" height="46" rx="8" fill="#3f1222" stroke="#fb7185" stroke-width="1.5"/>
      <text x="55" y="28" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">2. RESPONSE</text>
    </g>

    <g transform="translate(100, 274)">
      <rect x="0" y="0" width="120" height="46" rx="8" fill="#3f1222" stroke="#fb7185" stroke-width="1.5"/>
      <text x="60" y="28" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">3. REWARD</text>
    </g>

    <g transform="translate(-30, 137)">
      <rect x="0" y="0" width="110" height="46" rx="8" fill="#3f1222" stroke="#fb7185" stroke-width="1.5"/>
      <text x="55" y="28" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">4. MASTERY</text>
    </g>

    <circle cx="160" cy="160" r="24" fill="#fb7185" opacity="0.2"/>
    <text x="160" y="166" fill="#fda4af" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">LOOP</text>
  </g>

  <!-- Left Content (Direct & Clear) -->
  <g transform="translate(180, 240)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="200" height="34" rx="17" fill="rgba(251, 113, 133, 0.12)" stroke="rgba(251, 113, 133, 0.35)" stroke-width="1"/>
    <text x="100" y="22" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">GAME MECHANICS</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2">Intuitive Game Design</text>

    <!-- Direct Subtitle -->
    <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      5-Component Framework for game feel, pacing,
    </text>
    <text x="0" y="194" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      and instant interactive feedback.
    </text>

    <!-- Specs Meta -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
        Clarity · Motivation · Response · Satisfaction · Fit
      </text>
    </g>
  </g>
</svg>
