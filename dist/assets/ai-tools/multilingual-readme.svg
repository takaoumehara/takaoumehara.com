<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#241e14"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Container Box -->
  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic Diagram (Right side: Bilingual Sync) -->
  <g transform="translate(710, 200)">
    <!-- English Panel -->
    <rect x="0" y="30" width="140" height="260" rx="10" fill="#2a1f10" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="65" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">README.md</text>
    <line x1="20" y1="95" x2="120" y2="95" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="120" x2="100" y2="120" stroke="#fde68a" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="145" x2="115" y2="145" stroke="#fde68a" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="170" x2="80" y2="170" stroke="#fde68a" stroke-width="2" opacity="0.4"/>

    <!-- Sync Connectors -->
    <path d="M 140 160 L 200 160" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="170" cy="160" r="14" fill="#1e1810" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="170" y="165" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⇄</text>

    <!-- Japanese Panel -->
    <rect x="200" y="30" width="140" height="260" rx="10" fill="#2a1f10" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="270" y="65" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">README.ja.md</text>
    <line x1="220" y1="95" x2="320" y2="95" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="220" y1="120" x2="300" y2="120" stroke="#fde68a" stroke-width="2" opacity="0.4"/>
    <line x1="220" y1="145" x2="315" y2="145" stroke="#fde68a" stroke-width="2" opacity="0.4"/>
    <line x1="220" y1="170" x2="280" y2="170" stroke="#fde68a" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Left Content (Direct & Clear) -->
  <g transform="translate(180, 240)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="240" height="34" rx="17" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1"/>
    <text x="120" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">DOCUMENTATION ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2">Multilingual README</text>

    <!-- Direct Subtitle -->
    <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Natural bilingual documentation synchronization
    </text>
    <text x="0" y="194" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      without translation drift or robotic copy.
    </text>

    <!-- Specs Meta -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
        English ↔ Japanese · Shared Data Models · Auto-Lint
      </text>
    </g>
  </g>
</svg>
