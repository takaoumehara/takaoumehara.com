<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1c132b"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Container Box -->
  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic Diagram (Right side: Voice, Motion, Vision) -->
  <g transform="translate(710, 200)">
    <!-- Voice Wave -->
    <rect x="0" y="20" width="130" height="65" rx="10" fill="#2d1b4e" stroke="#c084fc" stroke-width="2"/>
    <text x="65" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">VOICE / AUDIO</text>

    <!-- Motion Vector -->
    <rect x="0" y="140" width="130" height="65" rx="10" fill="#2d1b4e" stroke="#c084fc" stroke-width="2"/>
    <text x="65" y="178" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">MOTION / WEB</text>

    <!-- Vision Mesh -->
    <rect x="0" y="260" width="130" height="65" rx="10" fill="#2d1b4e" stroke="#c084fc" stroke-width="2"/>
    <text x="65" y="298" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">VISION / FACE</text>

    <!-- Convergence Node -->
    <path d="M 130 52 L 230 172" stroke="#c084fc" stroke-width="2"/>
    <path d="M 130 172 L 230 172" stroke="#c084fc" stroke-width="2"/>
    <path d="M 130 292 L 230 172" stroke="#c084fc" stroke-width="2"/>

    <circle cx="230" cy="172" r="30" fill="#1e1b4b" stroke="#e879f9" stroke-width="2.5"/>
    <text x="230" y="177" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">LIVE</text>
  </g>

  <!-- Left Content (Direct & Clear) -->
  <g transform="translate(180, 240)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="rgba(192, 132, 252, 0.12)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1"/>
    <text x="110" y="22" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">CREATIVE TECHNOLOGY</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2">Interactive Experience</text>

    <!-- Direct Subtitle -->
    <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Skills for experiences where the input is a voice,
    </text>
    <text x="0" y="194" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      a hand, a face, or a room of phones.
    </text>

    <!-- Specs Meta -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
        HTML5 Canvas · WebRTC · Motion Tracking · Web Audio
      </text>
    </g>
  </g>
</svg>
