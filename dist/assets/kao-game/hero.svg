<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0d"/>
      <stop offset="50%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle mesh grid -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.75">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
  </g>

  <!-- Facial Landmark Mesh Art -->
  <g transform="translate(600, 390)" filter="url(#glow)">
    <!-- Outer Contour -->
    <path d="M-150,-180 C-80,-240 80,-240 150,-180 C210,-100 230,60 170,180 C110,270 0,320 0,320 C0,320 -110,270 -170,180 C-230,60 -210,-100 -150,-180 Z" fill="none" stroke="url(#cyan-glow)" stroke-width="2" opacity="0.6"/>

    <!-- Mesh Internal Triangles -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none">
      <!-- Eyebrows -->
      <path d="M-110,-90 Q-60,-130 -20,-95"/>
      <path d="M110,-90 Q60,-130 20,-95"/>

      <!-- Eyes -->
      <polygon points="-90,-60 -50,-80 -20,-60 -50,-40" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="-55" cy="-60" r="8" fill="#38bdf8"/>

      <polygon points="90,-60 50,-80 20,-60 50,-40" stroke="#818cf8" stroke-width="1.5"/>
      <circle cx="55" cy="-60" r="8" fill="#818cf8"/>

      <!-- Nose bridge & tip -->
      <polygon points="0,-95 -15,10 0,35 15,10" stroke="rgba(255,255,255,0.4)"/>
      <line x1="-30" y1="40" x2="30" y2="40" stroke="rgba(255,255,255,0.4)"/>

      <!-- Mouth & Expression Wireframe -->
      <polygon points="-75,110 0,85 75,110 45,150 0,165 -45,150" stroke="#38bdf8" stroke-width="2"/>
      <path d="M-65,115 Q0,175 65,115" stroke="#818cf8" stroke-width="1.5"/>

      <!-- Connecting vectors -->
      <line x1="-90" y1="-60" x2="-15" y2="10" opacity="0.4"/>
      <line x1="90" y1="-60" x2="15" y2="10" opacity="0.4"/>
      <line x1="-15" y1="10" x2="-75" y2="110" opacity="0.4"/>
      <line x1="15" y1="10" x2="75" y2="110" opacity="0.4"/>
      <line x1="0" y1="35" x2="0" y2="85" opacity="0.4"/>
      <line x1="-75" y1="110" x2="0" y2="320" opacity="0.3"/>
      <line x1="75" y1="110" x2="0" y2="320" opacity="0.3"/>
    </g>

    <!-- Landmark Points -->
    <g fill="#ffffff">
      <circle cx="-110" cy="-90" r="3"/>
      <circle cx="-20" cy="-95" r="3"/>
      <circle cx="110" cy="-90" r="3"/>
      <circle cx="20" cy="-95" r="3"/>
      <circle cx="0" cy="35" r="4" fill="#38bdf8"/>
      <circle cx="-75" cy="110" r="4" fill="#38bdf8"/>
      <circle cx="75" cy="110" r="4" fill="#818cf8"/>
      <circle cx="0" cy="165" r="4" fill="#818cf8"/>
      <circle cx="0" cy="320" r="4"/>
    </g>
  </g>

  <!-- Typographic Annotations -->
  <g font-family="'Outfit', ui-sans-serif, sans-serif" fill="#ffffff">
    <text x="80" y="100" font-size="14" font-weight="700" letter-spacing="3" text-transform="uppercase" opacity="0.5">PLAYABLE · FACE TRACKING EXPERIMENT</text>
    <text x="80" y="720" font-size="28" font-weight="800" letter-spacing="-0.5">Kao Game (顔ゲーム)</text>
    <text x="80" y="750" font-size="15" opacity="0.6">Zero controllers · 468 landmark points · In-browser real-time mesh</text>

    <text x="1120" y="720" font-size="13" font-family="'DM Mono', monospace" text-anchor="end" opacity="0.5">STATUS: IN-PROGRESS</text>
    <text x="1120" y="745" font-size="13" font-family="'DM Mono', monospace" text-anchor="end" opacity="0.5">INPUT: REAL-TIME WEBCAM</text>
  </g>
</svg>
