<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141f26"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Container Box -->
  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic Diagram (Right side: Central Capsule ↔ Models) -->
  <g transform="translate(720, 200)">
    <!-- Central Capsule Node -->
    <rect x="70" y="125" width="150" height="70" rx="14" fill="#0f2937" stroke="#2dd4bf" stroke-width="2"/>
    <text x="145" y="162" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">.HANDOFF /</text>
    <text x="145" y="180" fill="#5eead4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">STATE CAPSULE</text>

    <!-- Radiating Lines to 4 Models -->
    <!-- Claude -->
    <line x1="145" y1="125" x2="145" y2="50" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="80" y="10" width="130" height="40" rx="8" fill="#13232c" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="145" y="35" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Claude Code</text>

    <!-- Codex / Cursor -->
    <line x1="220" y1="160" x2="280" y2="160" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="280" y="140" width="100" height="40" rx="8" fill="#13232c" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="330" y="165" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Codex</text>

    <!-- Gemini CLI -->
    <line x1="145" y1="195" x2="145" y2="270" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="80" y="270" width="130" height="40" rx="8" fill="#13232c" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="145" y="295" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Gemini CLI</text>

    <!-- Antigravity -->
    <line x1="70" y1="160" x2="10" y2="160" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="-10" y="140" width="110" height="40" rx="8" fill="#13232c" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="45" y="165" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Antigravity</text>
  </g>

  <!-- Left Content (Direct & Clear) -->
  <g transform="translate(180, 240)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="rgba(45, 212, 191, 0.12)" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1"/>
    <text x="110" y="22" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">AGENT INFRASTRUCTURE</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2">Cross-Model Handoff</text>

    <!-- Direct Subtitle -->
    <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Lossless session and state capsule so any AI agent
    </text>
    <text x="0" y="194" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      can resume work with zero context loss.
    </text>

    <!-- Specs Meta -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
        Claude Code ↔ Codex ↔ Gemini CLI ↔ Antigravity
      </text>
    </g>
  </g>
</svg>
