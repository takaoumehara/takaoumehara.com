<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Container Box -->
  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic Diagram (Right side) -->
  <g transform="translate(680, 200)">
    <!-- Central Hub -->
    <rect x="0" y="160" width="130" height="80" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="206" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">SUPERFORGE</text>
    <circle cx="65" cy="180" r="4" fill="#38bdf8"/>

    <!-- Connecting Trunk -->
    <path d="M 130 200 L 220 200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 220 70 L 220 330" stroke="#38bdf8" stroke-width="2"/>

    <!-- 4 Branch Nodes (Think, Build, Test, Ship) -->
    <g>
      <line x1="220" y1="70" x2="260" y2="70" stroke="#38bdf8" stroke-width="2"/>
      <rect x="260" y="44" width="140" height="52" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="330" y="76" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">THINK · 3 SKILLS</text>
    </g>

    <g>
      <line x1="220" y1="155" x2="260" y2="155" stroke="#38bdf8" stroke-width="2"/>
      <rect x="260" y="130" width="140" height="52" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="330" y="162" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">BUILD · 4 SKILLS</text>
    </g>

    <g>
      <line x1="220" y1="245" x2="260" y2="245" stroke="#38bdf8" stroke-width="2"/>
      <rect x="260" y="220" width="140" height="52" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="330" y="252" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">TEST · 4 SKILLS</text>
    </g>

    <g>
      <line x1="220" y1="330" x2="260" y2="330" stroke="#38bdf8" stroke-width="2"/>
      <rect x="260" y="305" width="140" height="52" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="330" y="337" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">SHIP · 3 SKILLS</text>
    </g>
  </g>

  <!-- Left Content (Direct & Clear) -->
  <g transform="translate(180, 240)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="200" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <text x="100" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">CLAUDE CODE SKILL</text>

    <!-- Main Title -->
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">superforge</text>

    <!-- Direct Subtitle -->
    <text x="0" y="168" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" line-height="1.5">
      14 specialist skills routing from idea to pre-launch.
    </text>
    <text x="0" y="202" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">
      Routes work across Opus, Sonnet, Haiku, and Gemini.
    </text>

    <!-- Specs Meta -->
    <g transform="translate(0, 265)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
        Idea → Strategy → Build → Accessibility &amp; Launch
      </text>
    </g>
  </g>
</svg>
