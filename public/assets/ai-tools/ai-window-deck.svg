<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#14182b"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Container Box -->
  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic Diagram (Right side) - Multiple Windows -->
  <g transform="translate(680, 180)">
    <!-- Window 1 -->
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="90" y="30" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CLAUDE CODE #1</text>
    <text x="90" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Context: Feature A</text>
    <rect x="15" y="70" width="150" height="35" rx="4" fill="rgba(167, 139, 250, 0.15)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
    <text x="90" y="93" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Active Session</text>

    <!-- Window 2 -->
    <rect x="200" y="40" width="180" height="120" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="290" y="70" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CLAUDE CODE #2</text>
    <text x="290" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Context: Feature B</text>
    <rect x="215" y="110" width="150" height="35" rx="4" fill="rgba(167, 139, 250, 0.15)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
    <text x="290" y="133" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Active Session</text>

    <!-- Window 3 -->
    <rect x="100" y="180" width="180" height="120" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="190" y="210" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CODEX #1</text>
    <text x="190" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Context: Testing</text>
    <rect x="115" y="250" width="150" height="35" rx="4" fill="rgba(167, 139, 250, 0.15)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
    <text x="190" y="273" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Active Session</text>
  </g>

  <!-- Left Content (Direct & Clear) -->
  <g transform="translate(180, 240)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="200" height="34" rx="17" fill="rgba(167, 139, 250, 0.12)" stroke="rgba(167, 139, 250, 0.35)" stroke-width="1"/>
    <text x="100" y="22" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">CHROME EXTENSION</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">AI Window</text>
    <text x="0" y="160" fill="#ffffff" font-family="system-ui, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">Deck</text>

    <!-- Direct Subtitle -->
    <text x="0" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Run multiple Claude Code sessions side-by-side.
    </text>
    <text x="0" y="244" fill="#64748b" font-family="system-ui, sans-serif" font-size="17" font-weight="400">
      Compare approaches, test alternatives, keep context separate.
    </text>

    <!-- Specs Meta -->
    <g transform="translate(0, 295)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
        Multi-Window · Parallel Sessions · Context Preservation
      </text>
    </g>
  </g>
</svg>
