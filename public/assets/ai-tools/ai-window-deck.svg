<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Blueprint grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic: a deck of windows, one per project -->
  <g transform="translate(690, 230)" font-family="system-ui, sans-serif">
    <g>
      <rect x="0" y="0" width="160" height="110" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="0" y1="24" x2="160" y2="24" stroke="rgba(255,255,255,0.2)"/>
      <circle cx="14" cy="12" r="3.5" fill="#38bdf8"/>
      <text x="80" y="72" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">PROJECT A</text>
    </g>
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="160" height="110" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="0" y1="24" x2="160" y2="24" stroke="rgba(255,255,255,0.2)"/>
      <circle cx="14" cy="12" r="3.5" fill="#818cf8"/>
      <text x="80" y="72" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">PROJECT B</text>
    </g>
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="160" height="110" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="0" y1="24" x2="160" y2="24" stroke="rgba(255,255,255,0.2)"/>
      <circle cx="14" cy="12" r="3.5" fill="#818cf8"/>
      <text x="80" y="72" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">PROJECT C</text>
    </g>
    <g transform="translate(190, 140)">
      <rect x="0" y="0" width="160" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <line x1="0" y1="24" x2="160" y2="24" stroke="rgba(56,189,248,0.5)"/>
      <circle cx="14" cy="12" r="3.5" fill="#38bdf8"/>
      <text x="80" y="72" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">PROJECT D</text>
    </g>
    <text x="0" y="300" fill="#64748b" font-size="13" font-weight="600" letter-spacing="1.5">CLAUDE CODE · CODEX</text>
  </g>

  <!-- Left content -->
  <g transform="translate(180, 240)">
    <rect x="0" y="0" width="200" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <text x="100" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">CHROME EXTENSION</text>
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5">AI Window</text>
    <text x="0" y="176" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5">Deck</text>
    <text x="0" y="234" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Several projects at once.</text>
    <text x="0" y="268" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">Claude Code in the cloud and Codex.</text>
  </g>
</svg>
