<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Blueprint grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic: one index, many skills -->
  <g transform="translate(700, 220)">
    <rect x="0" y="140" width="130" height="80" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="186" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">INDEX</text>
    <circle cx="65" cy="160" r="4" fill="#38bdf8"/>
    <path d="M 130 180 L 200 180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 200 30 L 200 330" stroke="#38bdf8" stroke-width="2"/>
    <g fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1">
      <rect x="230" y="10" width="120" height="40" rx="8"/>
      <rect x="230" y="85" width="120" height="40" rx="8"/>
      <rect x="230" y="160" width="120" height="40" rx="8"/>
      <rect x="230" y="235" width="120" height="40" rx="8"/>
      <rect x="230" y="310" width="120" height="40" rx="8"/>
    </g>
    <g stroke="#38bdf8" stroke-width="2">
      <line x1="200" y1="30" x2="230" y2="30"/>
      <line x1="200" y1="105" x2="230" y2="105"/>
      <line x1="200" y1="180" x2="230" y2="180"/>
      <line x1="200" y1="255" x2="230" y2="255"/>
      <line x1="200" y1="330" x2="230" y2="330"/>
    </g>
    <g fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <text x="290" y="35">SKILL</text>
      <text x="290" y="110">SKILL</text>
      <text x="290" y="185">SKILL</text>
      <text x="290" y="260">SKILL</text>
      <text x="290" y="335">SKILL</text>
    </g>
  </g>

  <!-- Left content -->
  <g transform="translate(180, 240)">
    <rect x="0" y="0" width="250" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <text x="125" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">PLUGIN MARKETPLACE</text>
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5">Claude Code</text>
    <text x="0" y="176" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5">Skills</text>
    <text x="0" y="234" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Open skills in one index, with docs.</text>
    <text x="0" y="292" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="500">/plugin marketplace add takaoumehara/skills</text>
  </g>
</svg>
