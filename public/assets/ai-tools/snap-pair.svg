<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#111c2e"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Container Box -->
  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic Diagram (Right side) -->
  <g transform="translate(670, 190)">
    <!-- Room Host Screen -->
    <rect x="0" y="80" width="170" height="110" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="85" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">ROOM DISPLAY</text>
    <text x="85" y="152" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">QR CODE / PIN</text>

    <!-- Radiating Pairing Waves -->
    <path d="M 170 135 C 230 135, 230 30, 290 30" stroke="#60a5fa" stroke-width="2" fill="none"/>
    <path d="M 170 135 C 230 135, 230 135, 290 135" stroke="#60a5fa" stroke-width="2" fill="none"/>
    <path d="M 170 135 C 230 135, 230 240, 290 240" stroke="#60a5fa" stroke-width="2" fill="none"/>

    <!-- 3 Connected Phone Nodes -->
    <g transform="translate(290, 5)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="55" y="30" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Phone #1 · Active</text>
    </g>

    <g transform="translate(290, 110)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="55" y="30" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Phone #2 · Active</text>
    </g>

    <g transform="translate(290, 215)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="55" y="30" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Phone #N · Active</text>
    </g>
  </g>

  <!-- Left Content (Direct & Clear) -->
  <g transform="translate(180, 240)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="190" height="34" rx="17" fill="rgba(96, 165, 250, 0.12)" stroke="rgba(96, 165, 250, 0.35)" stroke-width="1"/>
    <text x="95" y="22" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">REACT + FIREBASE</text>

    <!-- Main Title -->
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">Snap Pair</text>

    <!-- Direct Subtitle -->
    <text x="0" y="168" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Every phone in the room joins the app in one scan.
    </text>
    <text x="0" y="202" fill="#64748b" font-family="system-ui, sans-serif" font-size="17" font-weight="400">
      Zero install, instant room pairing, and live state sync.
    </text>

    <!-- Specs Meta -->
    <g transform="translate(0, 265)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
        QR Pairing · Presence Heartbeat · 300 Devices / Room
      </text>
    </g>
  </g>
</svg>
