<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1a1525"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Container Box -->
  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic Diagram (Right side) - Skill Grid -->
  <g transform="translate(700, 160)">
    <!-- Skill Cards Grid -->
    <g>
      <rect x="0" y="0" width="110" height="70" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
      <text x="55" y="40" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">superforge</text>
    </g>

    <g>
      <rect x="130" y="0" width="110" height="70" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
      <text x="185" y="40" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">snap-pair</text>
    </g>

    <g>
      <rect x="0" y="90" width="110" height="70" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
      <text x="55" y="120" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">interactive-</text>
      <text x="55" y="135" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">experience</text>
    </g>

    <g>
      <rect x="130" y="90" width="110" height="70" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
      <text x="185" y="120" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">intuitive-</text>
      <text x="185" y="135" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">game-design</text>
    </g>

    <g>
      <rect x="0" y="180" width="110" height="70" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
      <text x="55" y="210" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">cross-model-</text>
      <text x="55" y="225" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">handoff</text>
    </g>

    <g>
      <rect x="130" y="180" width="110" height="70" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
      <text x="185" y="220" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ more</text>
    </g>

    <!-- Install Command -->
    <rect x="0" y="280" width="240" height="50" rx="8" fill="rgba(244, 114, 182, 0.15)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1"/>
    <text x="120" y="312" fill="#f472b6" font-family="'Courier New', monospace" font-size="12" text-anchor="middle">/plugin marketplace add</text>
  </g>

  <!-- Left Content (Direct & Clear) -->
  <g transform="translate(180, 240)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="rgba(244, 114, 182, 0.12)" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1"/>
    <text x="110" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">CLAUDE CODE SKILLS</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">Skills</text>
    <text x="0" y="160" fill="#ffffff" font-family="system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">Marketplace</text>

    <!-- Direct Subtitle -->
    <text x="0" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Specialist knowledge as installable plugins.
    </text>
    <text x="0" y="244" fill="#64748b" font-family="system-ui, sans-serif" font-size="17" font-weight="400">
      Install with /plugin marketplace add takaoumehara/skills
    </text>

    <!-- Specs Meta -->
    <g transform="translate(0, 295)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
        Claude Code · Codex · One-Command Install
      </text>
    </g>
  </g>
</svg>
