<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Blueprint grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic: a scattered tree becomes a tidy one -->
  <g transform="translate(690, 230)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <g opacity="0.55">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" transform="rotate(12 6 6)"/>
      <rect x="44" y="30" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" transform="rotate(-18 50 36)"/>
      <rect x="12" y="68" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" transform="rotate(26 18 74)"/>
      <rect x="64" y="104" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" transform="rotate(-8 70 110)"/>
      <rect x="6" y="140" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" transform="rotate(34 12 146)"/>
      <rect x="52" y="176" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" transform="rotate(-24 58 182)"/>
    </g>
    <path d="M 110 110 L 160 110" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 152 102 L 162 110 L 152 118" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <g transform="translate(190, 0)" fill="#e2e8f0">
      <path d="M 6 20 L 6 200" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 6 50 H 24 M 6 100 H 24 M 6 150 H 24 M 6 200 H 24" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="12">repo/</text>
      <text x="32" y="55">src/</text>
      <text x="32" y="105">docs/</text>
      <text x="32" y="155">tests/</text>
      <text x="32" y="205">README.md</text>
    </g>
  </g>

  <!-- Left content -->
  <g transform="translate(180, 240)">
    <rect x="0" y="0" width="200" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <text x="100" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">CLAUDE CODE SKILL</text>
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">repo-cleanup</text>
    <text x="0" y="168" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Tidy up a repository.</text>
    <text x="0" y="230" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="500">npx skills add takaoumehara/repo-cleanup</text>
  </g>
</svg>
