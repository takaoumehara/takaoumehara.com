<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1a1d29"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Container Box -->
  <rect x="100" y="80" width="1000" height="640" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Schematic Diagram (Right side) - Cleanup Flow -->
  <g transform="translate(700, 190)">
    <!-- Repository Before -->
    <rect x="0" y="0" width="180" height="140" rx="8" fill="#1e293b" stroke="rgba(239, 68, 68, 0.5)" stroke-width="2"/>
    <text x="90" y="25" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">BEFORE</text>
    <text x="90" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">42 stale branches</text>
    <text x="90" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">18 unused assets</text>
    <text x="90" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">7 orphaned deps</text>
    <rect x="20" y="110" width="140" height="20" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>

    <!-- Arrow Down -->
    <path d="M 90 150 L 90 190" stroke="#34d399" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="110" y="175" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CLEAN</text>

    <!-- Repository After -->
    <rect x="0" y="200" width="180" height="140" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="90" y="225" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AFTER</text>
    <text x="90" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">0 stale branches</text>
    <text x="90" y="275" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">0 unused assets</text>
    <text x="90" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">0 orphaned deps</text>
    <rect x="20" y="310" width="140" height="20" rx="4" fill="rgba(52, 211, 153, 0.2)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Left Content (Direct & Clear) -->
  <g transform="translate(180, 240)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1"/>
    <text x="90" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">NODE.JS · GIT</text>

    <!-- Main Title -->
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">repo-</text>
    <text x="0" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">cleanup</text>

    <!-- Direct Subtitle -->
    <text x="0" y="220" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Finds and removes stale branches, unused assets,
    </text>
    <text x="0" y="254" fill="#64748b" font-family="system-ui, sans-serif" font-size="17" font-weight="400">
      and orphaned dependencies. No manual archaeology.
    </text>

    <!-- Specs Meta -->
    <g transform="translate(0, 305)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
        Automated Detection · Safe Removal · Branch Analysis
      </text>
    </g>
  </g>
</svg>
