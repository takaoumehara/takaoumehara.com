<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire TV Shopping — Dual-Device Interactive Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #35C2F2;
    --accent-glow: rgba(53, 194, 242, 0.18);
    --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    
    /* White Background Theme */
    --bg: #FFFFFF;
    --bg-grad: #FFFFFF;
    --ink: oklch(0.18 0.015 250);
    --dim: oklch(0.45 0.015 250);
    
    /* Safari Chrome Colors - Light */
    --safari-bg: rgba(244, 244, 246, 0.94);
    --safari-border: rgba(0, 0, 0, 0.08);
    --safari-input: rgba(0, 0, 0, 0.05);
    --safari-icon: #007AFF; /* Apple Blue */
    --safari-icon-disabled: rgba(0, 0, 0, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Hanken Grotesk', -apple-system, sans-serif;
    background: var(--bg-grad);
    background-color: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
    transition: var(--transition);
  }

  /* Main Container */
  .container {
    max-width: 1500px;
    width: 100%;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    z-index: 10;
  }

  /* Simulator Stage */
  .simulation-stage {
    display: flex;
    gap: 48px;
    align-items: center;
    justify-content: center;
    flex-grow: 1;
    margin: 20px 0 30px;
  }

  .device-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .device-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  /* TV Frame CSS Mockup (Scaled up to 960px width) */
  .tv-device {
    width: 988px; /* 960px + 28pxベゼル */
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 50;
  }

  .tv-bezel {
    width: 988px;
    height: 574px; /* 540px + 34pxベゼル */
    background: #111;
    border: 14px solid #18181b;
    border-bottom: 20px solid #18181b;
    border-radius: 8px;
    position: relative;
    box-shadow: 
      0 35px 90px rgba(0,0,0,0.7),
      0 0 120px rgba(53, 194, 242, 0.07),
      inset 0 1px 0 rgba(255,255,255,0.1);
    overflow: hidden;
  }

  .tv-screen {
    width: 960px;
    height: 540px;
    background: #000;
    position: relative;
  }

  .tv-screen iframe {
    width: 1280px;
    height: 720px;
    border: none;
    position: absolute;
    top: 0; left: 0;
    transform: scale(0.75); /* 1280 ➔ 960 */
    transform-origin: top left;
  }

  .tv-logo {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.35);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.5px;
    pointer-events: none;
  }

  .tv-stand-neck {
    width: 70px;
    height: 40px;
    background: linear-gradient(90deg, #18181b, #2c2c2e, #18181b);
    box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
  }

  .tv-stand-base {
    width: 280px;
    height: 10px;
    background: linear-gradient(180deg, #27272a, #09090b);
    border-radius: 4px 4px 0 0;
    box-shadow: 0 12px 24px rgba(0,0,0,0.5);
  }

  /* Phone Frame CSS Mockup (Safari-Chrome Integrated) */
  .phone-device {
    width: 322px; /* 298px + 24pxベゼル */
    height: 692px; /* 668px + 24pxベゼル */
    background: #09090b;
    border: 12px solid #27272a;
    border-radius: 46px;
    position: relative;
    box-shadow: 
      0 35px 80px rgba(0,0,0,0.7),
      inset 0 0 4px rgba(255,255,255,0.15);
    z-index: 50;
    padding: 0; /* ベゼルをタイトにするため0に */
    overflow: hidden;
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 34px;
    overflow: hidden;
    position: relative;
    background: #111;
    display: flex;
    flex-direction: column;
  }

  /* iPhone Dynamic Island (Overlaid correctly over the top bar) */
  .phone-island {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 82px;
    height: 22px;
    background: #000;
    border-radius: 11px;
    z-index: 150;
    pointer-events: none;
    box-shadow: inset 0 0 2px rgba(255,255,255,0.2);
  }

  /* iPhone Home Indicator (Overlaid correctly over the bottom bar) */
  .phone-home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 105px;
    height: 4px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 2px;
    z-index: 150;
    pointer-events: none;
  }

  /* --- Safari Browser Chrome Styling --- */
  
  /* Top Bar (Height: 90px) */
  .safari-top-bar {
    height: 90px;
    background-color: var(--safari-bg);
    border-bottom: 1px solid var(--safari-border);
    display: flex;
    flex-direction: column;
    padding: 0 18px;
    z-index: 100;
    user-select: none;
    transition: var(--transition);
  }
  
  /* Status/Time Bar (40px) */
  .safari-status-bar {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink);
    padding-top: 14px;
  }
  .safari-status-bar .icons {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .safari-status-bar .icons svg {
    width: 13px; height: 13px;
    fill: var(--ink);
  }

  /* URL Address Bar (50px) */
  .safari-url-bar {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-bottom: 6px;
  }
  .safari-address-box {
    width: 100%;
    height: 28px;
    background-color: var(--safari-input);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    font-size: 12px;
    color: var(--ink);
  }
  .safari-address-text {
    flex-grow: 1;
    text-align: center;
    font-weight: 500;
    opacity: 0.85;
    letter-spacing: -0.1px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 8px;
  }
  .safari-url-bar svg {
    width: 12px; height: 12px;
    fill: var(--safari-icon);
  }

  /* Content iframe Area (Height: 500px) */
  .safari-content {
    flex-grow: 1;
    position: relative;
    background: #000;
  }
  .safari-content iframe {
    width: 390px;
    height: 664px; /* Render at full logical size */
    border: none;
    position: absolute;
    top: 0; left: 0;
    transform: scale(0.764); /* Scale down 390px ➔ 298px to fit screen width */
    transform-origin: top left;
  }

  /* Bottom Nav Bar (Height: 78px) */
  .safari-bottom-bar {
    height: 78px;
    background-color: var(--safari-bg);
    border-top: 1px solid var(--safari-border);
    display: flex;
    flex-direction: column;
    padding: 8px 24px 0;
    z-index: 100;
    user-select: none;
    transition: var(--transition);
  }
  
  .safari-nav-buttons {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 38px;
  }
  .safari-nav-buttons button {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--safari-icon);
    transition: var(--transition);
  }
  .safari-nav-buttons button.disabled {
    color: var(--safari-icon-disabled);
    pointer-events: none;
  }
  .safari-nav-buttons button svg {
    width: 20px; height: 20px;
    fill: currentColor;
  }

  /* Footer styling */
  .footer {
    text-align: center;
    font-size: 13px;
    color: var(--dim);
    margin-top: auto;
    padding-top: 20px;
  }

  /* Responsive Simulator Scaling */
  @media (max-width: 1350px) {
    .simulation-stage {
      transform: scale(0.9);
      margin: -30px 0;
    }
  }

  @media (max-width: 1200px) {
    .simulation-stage {
      flex-direction: column;
      gap: 30px;
      transform: none;
      margin: 20px 0;
    }
    .tv-device {
      width: 90vw;
      max-width: 760px;
    }
    .tv-bezel {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }
    .tv-screen {
      width: 100%;
      height: 100%;
    }
    .tv-screen iframe {
      width: 100%;
      height: 100%;
      transform: none;
    }
  }
</style>
</head>
<body>

<div class="container">



  <div class="simulation-stage">
    <!-- Fire TV Mockup (Left - Enlarged 960px width) -->
    <div class="device-wrapper tv-wrapper">
      <div class="tv-device">
        <div class="tv-bezel">
          <div class="tv-screen">
            <iframe src="./index.html?local=1" class="simulator-iframe"></iframe>
          </div>
          <div class="tv-logo">amazon</div>
        </div>
        <div class="tv-stand-neck"></div>
        <div class="tv-stand-base"></div>
      </div>
    </div>

    <!-- Smartphone Mockup (Right - Safari Chrome integrated) -->
    <div class="device-wrapper phone-wrapper">
      <div class="device-label">📱 iPhone (Mobile Safari)</div>
      <div class="phone-device">
        <div class="phone-island"></div>
        <div class="phone-screen">
          
          <!-- Safari Top Bar -->
          <div class="safari-top-bar">
            <div class="safari-status-bar">
              <span class="time">11:33</span>
              <div class="icons">
                <!-- Wifi, Cellular & Battery SVG mocks -->
                <svg viewBox="0 0 16 16"><path d="M2 11.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/></svg>
                <span class="battery-pct">63%</span>
              </div>
            </div>
            <div class="safari-url-bar">
              <div class="safari-address-box">
                <svg viewBox="0 0 24 24" style="width:10px;height:10px;opacity:0.6;"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <span class="safari-address-text">amazonshoppingon-tv.vercel.app</span>
                <svg viewBox="0 0 24 24" style="cursor:pointer;"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              </div>
            </div>
          </div>

          <!-- Safari Content Area -->
          <div class="safari-content">
            <iframe src="./remote.html?local=1"></iframe>
          </div>

          <!-- Safari Bottom Bar -->
          <div class="safari-bottom-bar">
            <div class="safari-nav-buttons">
              <button class="disabled">
                <svg viewBox="0 0 24 24"><path d="M15.41 16.59 10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
              </button>
              <button class="disabled">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
              </button>
              <button>
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
              </button>
              <button>
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
              </button>
              <button>
                <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
              </button>
            </div>
          </div>
          
        </div>
        <div class="phone-home-indicator"></div>
      </div>
    </div>
  </div>


</div>



</body>
</html>
